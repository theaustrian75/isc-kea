name: Build containers

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kea-dhcp4
            dockerfile: Dockerfile.kea-dhcp4
          - image: kea-dhcp-ddns
            dockerfile: Dockerfile.kea-dhcp-ddns

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: isc-kea/${{ matrix.image }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          chmod +x scripts/test-image.sh
          ./scripts/test-image.sh "isc-kea/${{ matrix.image }}:ci" "${{ matrix.image }}"

  multiarch:
    name: Multi-arch build ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kea-dhcp4
            dockerfile: Dockerfile.kea-dhcp4
          - image: kea-dhcp-ddns
            dockerfile: Dockerfile.kea-dhcp-ddns

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build linux/amd64 + linux/arm64 (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: isc-kea/${{ matrix.image }}:multiarch
          cache-from: type=gha
          cache-to: type=gha,mode=max
