# Local / lab compose for ISC Kea images.
# Config and TLS material are bind-mounted; nothing secret is baked into images.
#
#   cp .env.example .env
#   docker compose build
#   docker compose up -d

name: isc-kea

services:
  kea-dhcp4:
    image: ${KEA_DHCP4_IMAGE:-ghcr.io/theaustrian75/isc-kea/kea-dhcp4:latest}
    build:
      context: .
      dockerfile: Dockerfile.kea-dhcp4
      args:
        KEA_UID: ${KEA_UID:-100}
        KEA_GID: ${KEA_GID:-101}
    container_name: ${KEA_DHCP4_CONTAINER_NAME:-kea-dhcp4}
    environment:
      KEA_UID: ${KEA_UID:-100}
      KEA_GID: ${KEA_GID:-101}
      TZ: ${TZ:-UTC}
      # status-get over the HTTP(S) control channel (see healthcheck.sh)
      KEA_HEALTHCHECK_URL: ${KEA_DHCP4_HEALTHCHECK_URL:-http://127.0.0.1:8001/}
      KEA_HEALTHCHECK_INSECURE: ${KEA_HEALTHCHECK_INSECURE:-true}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - NET_RAW
    volumes:
      - ${KEA_DHCP4_CONFIG_DIR:-./config/kea-dhcp4}:/etc/kea:ro
      # Separate TLS trees: control API (port 8001) vs HA peers (port 8000).
      - ${KEA_DHCP4_CONTROL_CERT_DIR:-./certs/kea-dhcp4/control}:/etc/kea/certs/control:ro
      - ${KEA_DHCP4_HA_CERT_DIR:-./certs/kea-dhcp4/ha}:/etc/kea/certs/ha:ro
      - kea-dhcp4-data:/var/lib/kea
    tmpfs:
      - /run/kea:rw,mode=0750,size=16m,uid=${KEA_UID:-100},gid=${KEA_GID:-101}
      - /tmp:rw,mode=1777,size=16m
    network_mode: host
    restart: unless-stopped

  kea-dhcp-ddns:
    image: ${KEA_DDNS_IMAGE:-ghcr.io/theaustrian75/isc-kea/kea-dhcp-ddns:latest}
    build:
      context: .
      dockerfile: Dockerfile.kea-dhcp-ddns
      args:
        KEA_UID: ${KEA_UID:-100}
        KEA_GID: ${KEA_GID:-101}
    container_name: ${KEA_DDNS_CONTAINER_NAME:-kea-dhcp-ddns}
    environment:
      KEA_UID: ${KEA_UID:-100}
      KEA_GID: ${KEA_GID:-101}
      TZ: ${TZ:-UTC}
      # Example (tyr): https://10.255.255.6:8002/
      KEA_HEALTHCHECK_URL: ${KEA_DDNS_HEALTHCHECK_URL:-http://127.0.0.1:8002/}
      KEA_HEALTHCHECK_INSECURE: ${KEA_HEALTHCHECK_INSECURE:-true}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # No NET_BIND_SERVICE: DDNS listens on 53001 (>1024).
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    volumes:
      - ${KEA_DDNS_CONFIG_DIR:-./config/kea-dhcp-ddns}:/etc/kea:ro
      - ${KEA_DDNS_CONTROL_CERT_DIR:-./certs/kea-dhcp-ddns/control}:/etc/kea/certs/control:ro
    tmpfs:
      - /run/kea:rw,mode=0750,size=16m,uid=${KEA_UID:-100},gid=${KEA_GID:-101}
      - /tmp:rw,mode=1777,size=16m
    network_mode: host
    restart: unless-stopped

volumes:
  kea-dhcp4-data:
