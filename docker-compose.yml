# Local / lab compose for ISC Kea images.
# Config and TLS material are bind-mounted; nothing secret is baked into images.
#
# Default images come from GHCR (see CI). Override with .env or build locally:
#   docker compose build
#   docker compose up -d

name: isc-kea

services:
  kea-dhcp4:
    image: ${KEA_DHCP4_IMAGE:-ghcr.io/theaustrian75/isc-kea/kea-dhcp4:latest}
    build:
      context: .
      dockerfile: Dockerfile.kea-dhcp4
    container_name: ${KEA_DHCP4_CONTAINER_NAME:-kea-dhcp4}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - NET_RAW
    volumes:
      - ${KEA_DHCP4_CONFIG_DIR:-./config/kea-dhcp4}:/etc/kea:ro
      - kea-dhcp4-data:/var/lib/kea
    tmpfs:
      - /run/kea:rw,mode=0750,size=16m
      - /tmp:rw,mode=1777,size=16m
    network_mode: host
    restart: unless-stopped

  kea-dhcp-ddns:
    image: ${KEA_DDNS_IMAGE:-ghcr.io/theaustrian75/isc-kea/kea-dhcp-ddns:latest}
    build:
      context: .
      dockerfile: Dockerfile.kea-dhcp-ddns
    container_name: ${KEA_DDNS_CONTAINER_NAME:-kea-dhcp-ddns}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ${KEA_DDNS_CONFIG_DIR:-./config/kea-dhcp-ddns}:/etc/kea:ro
    tmpfs:
      - /run/kea:rw,mode=0750,size=16m
      - /tmp:rw,mode=1777,size=16m
    network_mode: host
    restart: unless-stopped

volumes:
  kea-dhcp4-data:
